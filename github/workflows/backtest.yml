name: Backtest

# Manual only - this is a "run it when you want a read on the model"
# tool, not something that needs to run on a schedule.
on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python -m src.backtest | tee /tmp/backtest_report.txt

      - name: Post results as a GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Backtest results - $(date -u +%Y-%m-%d)" \
            --body-file /tmp/backtest_report.txt
